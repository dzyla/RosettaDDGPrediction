[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "RosettaDDGPrediction"
version = "1.0.0"
description = "Python wrapper of Rosetta-based protocols for ΔΔG calculation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.81",
    "dask>=2023.1.0",
    "distributed>=2023.1.0",
    "matplotlib>=3.5.0",
    "MDAnalysis>=2.0.0",
    "numpy>=1.21.0,<2.0.0",  # Crucial to prevent NumPy 2.0 breakages
    "pandas>=1.3.0,<2.2.0",  # Crucial to prevent Pandas breakages
    "pyyaml>=6.0",
    "seaborn>=0.11.0",
    "setuptools>=61.0"
]

[project.scripts]
rosetta_ddg_run = "RosettaDDGPrediction.rosetta_ddg_run:main"
rosetta_ddg_check_run = "RosettaDDGPrediction.rosetta_ddg_check_run:main"
rosetta_ddg_aggregate = "RosettaDDGPrediction.rosetta_ddg_aggregate:main"
rosetta_ddg_plot = "RosettaDDGPrediction.rosetta_ddg_plot:main"

[tool.setuptools]
packages = ["RosettaDDGPrediction"]
include-package-data = true

[tool.setuptools.package-data]
"RosettaDDGPrediction" = ["config_aggregate/*", "config_plot/*", "config_run/*", "config_settings/*", "files/*", "RosettaScripts/*"]
